[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seven-agent-force-runtime-sdk"
version = "0.1.0"
requires-python = ">=3.11"
description = "Image-owned Workforce execution protocol tools"
license = {text = "Apache-2.0"}

[project.scripts]
seven-agent-force-runtime = "seven_agent.force.__main__:main"
seven-workforce-runtime = "seven_workforce_runtime.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
