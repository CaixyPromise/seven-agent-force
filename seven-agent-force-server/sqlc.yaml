version: "2"

sql:
  - engine: mysql
    schema:
      - "migrations/mysql"
    queries:
      - "internal/infrastructure/datasource/mysql/queries"
    gen:
      go:
        package: "sqlc"
        out: "internal/infrastructure/datasource/mysql/sqlc"
        sql_package: "database/sql"
        emit_interface: false
        emit_json_tags: true
        emit_empty_slices: true
